<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المحتوى — Creatology</title><link href="/admin/config.yml" type="text/yaml" rel="cms-config-url"></head><body><script src="/admin/sveltia-cms.js"></script><script>CMS.registerPreviewStyle("/theme.css");
try {
  const BiographyPreview = createClass({
    render: function() {
      const entry = this.props.entry;
      const title = entry.getIn(['data', 'title']) || '';
      const sections = entry.getIn(['data', 'extra', 'sections']);
      return h('div', { className: 'wrap cv-layout', style: { padding: '20px' } },
        h('div', { className: 'page-heading' }, h('h1', {}, title)),
        h('div', { 'data-content-region': true },
          sections && sections.size ? sections.map((sec, idx) =>
            h('section', { className: 'cv-section', key: idx },
              h('h2', {}, sec.get('title')),
              h('div', { className: 'prose', dangerouslySetInnerHTML: { __html: sec.get('html') || '' } })
            )
          ) : this.props.widgetFor('body')
        )
      );
    }
  });
  CMS.registerPreviewTemplate('biography-and-contact', BiographyPreview);
  CMS.registerPreviewTemplate('pages', BiographyPreview);
} catch(e) {}
</script></body></html>
