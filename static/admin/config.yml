backend:
  name: github
  repo: local/ayman-amer
  branch: main
locale: ar
media_folder: static/wp-content/uploads/editor
public_folder: /wp-content/uploads/editor
site_url: https://draymanamer.com
display_url: http://localhost:1111
collections:
- name: articles
  label: الدراسات
  folder: content/articles
  create: true
  extension: md
  format: yaml-frontmatter
  slug: '{{slug}}'
  identifier_field: title
  filter:
    field: template
    pattern: article.html
  fields:
  - name: title
    label: العنوان
    widget: string
  - name: date
    label: التاريخ
    widget: datetime
  - name: draft
    label: مسودة
    widget: boolean
    default: true
  - name: path
    label: رابط الصفحة — لا تغير روابط المحتوى المستورد
    widget: string
    pattern:
    - ^/[^?#\\]*$
    - Use a site path such as /books/new-book/. Existing imported paths are protected at build time.
  - name: template
    widget: hidden
    default: article.html
  - name: extra
    label: بيانات الصفحة
    widget: object
    fields:
    - name: wordpress_id
      widget: hidden
      required: false
    - name: type
      widget: hidden
      default: post
    - name: original_url
      widget: hidden
      required: false
    - name: display_title
      widget: hidden
      required: false
    - name: image
      label: الصورة
      widget: image
      required: false
    - name: image_link
      widget: hidden
      required: false
    - name: source_metadata
      widget: hidden
      required: false
    - name: terms
      widget: hidden
      required: false
    - name: archive_source_path
      widget: hidden
      required: false
    - name: seo_title
      widget: hidden
      required: false
    - name: seo_meta
      widget: hidden
      required: false
    - name: canonical_url
      widget: hidden
      required: false
    - name: wordpress_title
      widget: hidden
      required: false
    - name: initial_title
      widget: hidden
      required: false
    - name: wordpress_local_date
      widget: hidden
      required: false
    - name: wordpress_local_modified
      widget: hidden
      required: false
  - name: body
    label: المحتوى
    widget: richtext
    format: html
    modes:
    - rich_text
    - raw
    required: false
  - name: updated
    widget: hidden
    required: false
  - name: taxonomies
    label: التصنيف
    widget: object
    required: false
    fields:
    - name: category
      label: الأقسام
      widget: select
      multiple: true
      required: false
      options:
      - label: البحوث العلمية
        value: البحوث-العلمية
      - label: المقالات الثقافية
        value: المقالات-الثقافية
      - label: رسائل اكاديمية (الاشراف)
        value: رسائل-اكاديمية-الاشراف
      - label: غير مصنف
        value: غير-مصنف
