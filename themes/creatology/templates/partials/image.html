{% set source_path = responsive_images | get(key=image_src, default="") %}<picture>{% if source_path %}{% set small=resize_image(path=source_path,width=640,height=960,op="fit",format="webp") %}{% set large=resize_image(path=source_path,width=1280,height=1600,op="fit",format="webp") %}<source type="image/webp" srcset="{{ small.url }} {{ small.width }}w{% if large.width != small.width %}, {{ large.url }} {{ large.width }}w{% endif %}" sizes="(max-width: 760px) 88vw, 480px">{% endif %}<img src="{{ image_src }}" alt="{{ image_alt or '' }}" loading="{{ image_loading or 'lazy' }}" decoding="async" width="{{ image_width or 480 }}" height="{{ image_height or 340 }}"></picture>
